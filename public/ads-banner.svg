<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1e30;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a2e4a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8a020;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5c842;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.01"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="1200" height="628" fill="url(#bgGrad)"/>

  <!-- Dekoratif geometrik desenler (sağ taraf) -->
  <polygon points="750,0 1200,0 1200,628 650,628" fill="#ffffff" opacity="0.03"/>
  <polygon points="820,0 1200,0 1200,628 720,628" fill="#e8a020" opacity="0.06"/>

  <!-- Dekoratif çizgiler -->
  <line x1="0" y1="120" x2="600" y2="120" stroke="#e8a020" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="508" x2="600" y2="508" stroke="#e8a020" stroke-width="1" opacity="0.15"/>

  <!-- Sol içerik bloğu -->
  <!-- Logo ikonu (çatı) -->
  <rect x="72" y="72" width="80" height="80" rx="10" fill="#e8a020" opacity="0.12"/>
  <polygon points="112,84 148,108 76,108" fill="#e8a020"/>
  <rect x="84" y="108" width="56" height="36" rx="3" fill="#e8a020" opacity="0.8"/>
  <rect x="100" y="120" width="24" height="24" rx="3" fill="#0f1e30"/>

  <!-- Firma adı -->
  <text x="172" y="108" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-1">POYRAZ</text>
  <text x="172" y="142" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#e8a020" letter-spacing="6">DEKORASYON</text>

  <!-- Ayırıcı çizgi -->
  <rect x="72" y="175" width="480" height="3" rx="2" fill="url(#goldGrad)"/>

  <!-- Slogan -->
  <text x="72" y="230" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">İzmir Bornova'da Güvenilir</text>
  <text x="72" y="278" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#e8a020">Tadilat &amp; Dekorasyon Ustası</text>

  <!-- Hizmetler listesi (sol sütun) -->
  <!-- Madde 1 -->
  <rect x="72" y="318" width="8" height="8" rx="2" fill="#e8a020"/>
  <text x="92" y="328" font-family="Arial, sans-serif" font-size="18" fill="#ccddee">Fayans &amp; Seramik Döşeme</text>

  <!-- Madde 2 -->
  <rect x="72" y="352" width="8" height="8" rx="2" fill="#e8a020"/>
  <text x="92" y="362" font-family="Arial, sans-serif" font-size="18" fill="#ccddee">Boya, Badana &amp; Alçı Sıva</text>

  <!-- Madde 3 -->
  <rect x="72" y="386" width="8" height="8" rx="2" fill="#e8a020"/>
  <text x="92" y="396" font-family="Arial, sans-serif" font-size="18" fill="#ccddee">Çatı Tamiratı &amp; İzolasyon</text>

  <!-- Madde 4 (sağ sütun) -->
  <rect x="330" y="318" width="8" height="8" rx="2" fill="#e8a020"/>
  <text x="350" y="328" font-family="Arial, sans-serif" font-size="18" fill="#ccddee">Mutfak &amp; Banyo Tadilatı</text>

  <!-- Madde 5 -->
  <rect x="330" y="352" width="8" height="8" rx="2" fill="#e8a020"/>
  <text x="350" y="362" font-family="Arial, sans-serif" font-size="18" fill="#ccddee">Demir Doğrama &amp; Tavan</text>

  <!-- Madde 6 -->
  <rect x="330" y="386" width="8" height="8" rx="2" fill="#e8a020"/>
  <text x="350" y="396" font-family="Arial, sans-serif" font-size="18" fill="#ccddee">Su Tesisatı &amp; Tamir</text>

  <!-- CTA kutu -->
  <rect x="72" y="440" width="260" height="68" rx="8" fill="#e8a020"/>
  <text x="202" y="468" font-family="Arial Black, Arial, sans-serif" font-size="14" font-weight="900" fill="#0f1e30" text-anchor="middle" letter-spacing="1">ÜCRETSİZ KEŞİF</text>
  <text x="202" y="492" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="#0f1e30" text-anchor="middle">0545 209 65 57</text>

  <!-- İkinci telefon -->
  <text x="350" y="462" font-family="Arial, sans-serif" font-size="14" fill="#8aaabb">veya</text>
  <text x="350" y="488" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">0506 178 31 49</text>

  <!-- Web sitesi -->
  <text x="72" y="564" font-family="Arial, sans-serif" font-size="15" fill="#8aaabb">poyrazdekorasyon.net  ·  Mevlana Mah. 1776/14 No:11, Bornova / İzmir</text>

  <!-- Sağ taraf: Dekoratif çatı ikonu (büyük, arka plan) -->
  <g opacity="0.08" transform="translate(800, 80)">
    <polygon points="200,0 380,140 20,140" fill="#e8a020"/>
    <rect x="40" y="140" width="320" height="220" rx="8" fill="#e8a020"/>
    <rect x="130" y="200" width="100" height="160" fill="#0f1e30" rx="6"/>
    <rect x="60" y="180" width="70" height="70" fill="#0f1e30" rx="4"/>
    <rect x="270" y="180" width="70" height="70" fill="#0f1e30" rx="4"/>
  </g>

  <!-- Sağ taraf: Yıldız/kalite işareti -->
  <g transform="translate(950, 260)">
    <circle cx="0" cy="0" r="90" fill="#ffffff" opacity="0.03"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#e8a020" stroke-width="1.5" opacity="0.3"/>
    <text x="0" y="-18" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="#e8a020" text-anchor="middle" opacity="0.9">20+</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" opacity="0.7">YIL</text>
    <text x="0" y="32" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" opacity="0.7">DENEYİM</text>

    <circle cx="0" cy="0" r="90" fill="none" stroke="#e8a020" stroke-width="1" opacity="0.15" stroke-dasharray="8 6"/>
  </g>

  <g transform="translate(1080, 420)">
    <circle cx="0" cy="0" r="65" fill="#ffffff" opacity="0.03"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#e8a020" stroke-width="1.5" opacity="0.3"/>
    <text x="0" y="-12" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#e8a020" text-anchor="middle" opacity="0.9">500+</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.7">PROJE</text>
  </g>
</svg>
