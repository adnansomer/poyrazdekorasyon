<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <!-- Arka plan -->
  <rect width="1200" height="1200" fill="#1a2e4a"/>

  <!-- Çatı / ev ikonu -->
  <polygon points="600,220 920,480 280,480" fill="#e8a020"/>
  <!-- Ev gövdesi -->
  <rect x="320" y="478" width="560" height="380" rx="8" fill="#e8a020" opacity="0.9"/>
  <!-- Kapı -->
  <rect x="500" y="600" width="200" height="258" rx="10" fill="#1a2e4a"/>
  <!-- Sol pencere -->
  <rect x="355" y="560" width="110" height="110" rx="8" fill="#1a2e4a"/>
  <!-- Sağ pencere -->
  <rect x="735" y="560" width="110" height="110" rx="8" fill="#1a2e4a"/>

  <!-- Firma adı -->
  <text
    x="600" y="960"
    font-family="Arial Black, Arial, sans-serif"
    font-size="148"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-2"
  >POYRAZ</text>

  <!-- Alt yazı -->
  <text
    x="600" y="1040"
    font-family="Arial, sans-serif"
    font-size="62"
    font-weight="400"
    fill="#e8a020"
    text-anchor="middle"
    letter-spacing="14"
  >DEKORASYON</text>

  <!-- İnce ayırıcı çizgi -->
  <rect x="200" y="1068" width="800" height="3" rx="2" fill="#e8a020" opacity="0.35"/>

  <!-- Şehir etiketi -->
  <text
    x="600" y="1120"
    font-family="Arial, sans-serif"
    font-size="38"
    fill="#7a9ab5"
    text-anchor="middle"
    letter-spacing="6"
  >İZMİR · BORNOVA</text>
</svg>
